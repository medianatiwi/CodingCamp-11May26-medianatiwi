<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense &amp; Budget Visualizer</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header>
      <h1>Expense &amp; Budget Visualizer</h1>
      <div id="balance-display">Total: $0.00</div>
      <div id="storage-error-banner" hidden>
        Could not load saved data. Starting fresh.
      </div>
    </header>

    <main>
      <section id="form-section">
        <form id="expense-form" novalidate>
          <div class="form-group">
            <label for="item-name">Item name</label>
            <input
              id="item-name"
              type="text"
              placeholder="Item name"
              autocomplete="off"
            />
          </div>

          <div class="form-group">
            <label for="item-amount">Amount</label>
            <input
              id="item-amount"
              type="number"
              placeholder="Amount"
              min="0.01"
              step="0.01"
            />
          </div>

          <div class="form-group">
            <label for="item-category">Category</label>
            <select id="item-category">
              <option value="">Select category</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Fun">Fun</option>
            </select>
          </div>

          <button type="submit">Add</button>

          <div id="form-errors" role="alert" aria-live="polite"></div>
        </form>
      </section>

      <section id="list-section">
        <h2>Transactions</h2>
        <ul id="transaction-list"></ul>
      </section>

      <section id="chart-section">
        <h2>Spending by Category</h2>
        <div id="chart-container">
          <canvas id="spending-chart"></canvas>
          <p id="chart-empty-message" hidden>No transactions yet.</p>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/app.js" defer></script>
  </body>
</html>
